server:
  address: ${SIMPLELABEL_BIND_ADDRESS:0.0.0.0}
  port: ${SIMPLELABEL_PORT:18084}
  tomcat:
    max-swallow-size: 16GB
    max-http-form-post-size: 16GB

spring:
  servlet:
    multipart:
      max-file-size: 16GB
      max-request-size: 16GB
      file-size-threshold: 2MB
  thymeleaf:
    cache: false
simplelabel:
  root: ${SIMPLELABEL_ROOT:.}
  data-dir: ${SIMPLELABEL_DATA_DIR:data}
  models-dir: ${SIMPLELABEL_MODELS_DIR:models}
  logs-dir: ${SIMPLELABEL_LOGS_DIR:logs}
  admin-dir: ${SIMPLELABEL_ADMIN_DIR:admin}
  processed-dir: ${SIMPLELABEL_PROCESSED_DIR:processed}
  static-dir: ${SIMPLELABEL_STATIC_DIR:static}
  yolo-worker-url: ${SIMPLELABEL_YOLO_WORKER_URL:http://127.0.0.1:18085}
  yolo-worker-token: ${SIMPLELABEL_YOLO_WORKER_TOKEN:local-simplelabel-worker}
  admin-token-hashes: ${SIMPLELABEL_ADMIN_TOKEN_HASHES:}
  admin-cookie-days: ${SIMPLELABEL_ADMIN_COOKIE_DAYS:365}
  admin-cookie-secure: ${SIMPLELABEL_ADMIN_COOKIE_SECURE:false}
  time-zone: ${SIMPLELABEL_TIME_ZONE:Asia/Shanghai}

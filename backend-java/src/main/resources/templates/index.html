<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Simple Label Studio</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5">
    <style>
        .main-folder-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 14px; overflow: hidden;
        }
        .main-folder-header {
            display: flex; align-items: center; padding: 14px 18px;
            cursor: pointer; user-select: none; transition: background 0.15s;
        }
        .main-folder-header:hover { background: var(--bg-hover); }
        .main-folder-icon { font-size: 22px; margin-right: 10px; }
        .main-folder-info { flex: 1; }
        .main-folder-name { font-weight: 600; font-size: 16px; color: var(--text-primary); }
        .main-folder-meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .main-folder-actions { display: flex; gap: 4px; }
        .main-folder-arrow {
            font-size: 13px; transition: transform 0.2s; color: var(--text-dim);
            margin-left: 8px; padding: 6px;
        }
        .main-folder-card.open .main-folder-arrow { transform: rotate(90deg); }

        .subfolder-list { display: none; border-top: 1px solid var(--border-color); }
        .main-folder-card.open .subfolder-list { display: block; }

        .subfolder-item {
            display: flex; align-items: center; padding: 9px 18px 9px 48px;
            transition: background 0.15s; border-bottom: 1px solid rgba(128,128,128,0.07);
        }
        .subfolder-item:hover { background: var(--bg-hover); }
        .subfolder-item:last-child { border-bottom: none; }
        .subfolder-icon { font-size: 16px; margin-right: 8px; color: var(--text-dim); }
        .subfolder-name { flex: 1; font-size: 14px; }
        .subfolder-name a { color: var(--accent-blue); text-decoration: none; }
        .subfolder-name a:hover { text-decoration: underline; }
        .subfolder-count { font-size: 12px; color: var(--text-dim); margin-right: 8px; }
        .subfolder-actions { display: flex; gap: 4px; }

        .btn-icon {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 4px 9px; border-radius: 3px;
            cursor: pointer; font-size: 12px;
        }
        .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-icon.delete { color: var(--accent-red); border-color: var(--accent-red); }
        .btn-icon.delete:hover { background: var(--accent-red); color: #fff; }
        .btn-icon.export { color: var(--accent-green); border-color: var(--accent-green); }
        .btn-icon.export:hover { background: var(--accent-green); color: #fff; }

        .upload-section {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 18px; margin-bottom: 20px;
        }
        .upload-section h3 { margin: 0 0 10px 0; font-size: 16px; }
        .upload-section p { font-size: 13px; }
        .upload-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .upload-row input[type="text"] { padding: 8px 12px; background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; }
        .upload-target-label { color: var(--text-dim); font-size: 14px; white-space: nowrap; }
        .upload-target-val { color: var(--accent-blue); font-weight: 600; font-size: 14px; }
        .processing-label-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .processing-label-choice { padding:7px 10px; border:1px solid var(--border-color); border-radius:4px; background:var(--bg-input); color:var(--text-primary); cursor:pointer; }
        .processing-label-choice.selected { background:var(--bg-active); border-color:var(--accent-blue); color:#fff; }
    </style>
</head>
<body class="dark">
    <div class="container">
        <h1 th:text="${dataProcessing} ? '数据处理' : '数据标注'">数据标注</h1>

        <div class="index-top-actions">
            <button onclick="location.href='/'" class="toolbar-btn" style="padding:8px 20px;font-size:14px;">Home</button>
            <button th:if="${isAdmin}" onclick="location.href='/work-logs'" class="toolbar-btn accent-purple" style="padding:8px 20px;font-size:14px;">📊 工作日志</button>
            <button th:if="${isAdmin}" onclick="location.href='/admin/tokens'" class="toolbar-btn accent-purple" style="padding:8px 20px;font-size:14px;">🔑 令牌管理</button>
            <button th:if="${adminDeviceTokenEnabled and !isAdmin}" onclick="location.href='/admin/activate'" class="toolbar-btn accent-purple" style="padding:8px 20px;font-size:14px;">🔑 激活管理员设备</button>
            <button onclick="toggleUploadMode()" id="toggle-upload-btn" class="toolbar-btn accent-green" style="padding:8px 20px;font-size:14px;">📁 上传任务文件夹</button>
        </div>

        <div th:if="${dataProcessing}" id="processing-label-modal" class="modal" style="display:none;">
            <div class="modal-content" style="max-width:480px;">
                <div class="modal-header">确认 YOLO 标签顺序</div>
                <div class="modal-body"><p style="font-size:13px;color:var(--text-secondary);margin-top:0;">请按顺序点击全部非 mask 标签。mask 区域会涂黑且不会导出。</p><div id="processing-label-list" class="processing-label-list"></div><div id="processing-label-status" style="margin-top:12px;font-size:12px;color:var(--text-secondary);"></div></div>
                <div class="modal-footer"><button class="btn btn-secondary" onclick="closeProcessingLabelModal()">取消</button><button id="processing-start-btn" class="btn btn-primary" onclick="startDatasetProcessing()" disabled>开始处理</button></div>
            </div>
        </div>

        <div class="upload-section" id="upload-section" style="display:none;">
            <h3>上传标注任务</h3>
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 10px 0;">
                选择一个图片文件夹。顶层文件夹名将作为任务名，上传完成后自动进入“未标注”。
            </p>
            <div class="upload-row">
                <input type="file" id="file-input-folder" webkitdirectory directory multiple>
                <button onclick="uploadFiles()" id="upload-btn" style="padding:8px 20px;background:var(--accent-green);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:600;">上传</button>
            </div>
            <div id="upload-status" style="margin-top:6px;font-size:12px;"></div>
        </div>

        <div class="project-list">
            <div class="main-folder-card" th:each="mf, stat : ${mainFolders}" th:id="|card-${stat.count}|">
                <div class="main-folder-header" th:attr="data-folder=${mf.name},data-index=${stat.count}" onclick="onMainFolderClick(this.dataset.folder, this, this.dataset.index)">
                    <span class="main-folder-icon">&#128193;</span>
                    <div class="main-folder-info">
                        <div class="main-folder-name"><span th:text="${mf.name}"></span><span th:if="${mf.legacy}" style="font-size:11px;color:var(--text-dim);margin-left:8px;">历史数据 · 只读</span></div>
                        <div class="main-folder-meta" th:if="${mf.workflow_state == 'unlabeled'}"><span th:text="${mf.sub_count}"></span> 个任务 · <span th:text="${mf.total_images}"></span> 张图片</div>
                        <div class="main-folder-meta" th:unless="${mf.workflow_state == 'unlabeled'}"><span th:text="${mf.sub_count}"></span> 个任务 · 已标注 <span th:text="${mf.total_annotated}"></span> / <span th:text="${mf.total_images}"></span> 张</div>
                    </div>
                    <div class="main-folder-actions" onclick="event.stopPropagation()">
                        <span th:if="${mf.legacy}" style="font-size:11px;color:var(--text-dim);">只读</span>
                    </div>
                    <span class="main-folder-arrow" th:attr="data-index=${stat.count}" onclick="event.stopPropagation(); toggleFolder(this.dataset.index)">&#9654;</span>
                </div>
                <div class="subfolder-list">
                    <div class="subfolder-item" th:each="sf : ${mf.subfolders}">
                        <span class="subfolder-icon">&#128196;</span>
                        <span class="subfolder-name">
                            <a th:href="@{/annotate/{main}/{sub}(main=${mf.name},sub=${sf.name})}" th:text="${sf.name}"></a>
                        </span>
                        <span class="subfolder-count" th:if="${mf.workflow_state == 'unlabeled'}"><span th:text="${sf.count}"></span> 张图片</span>
                        <span class="subfolder-count" th:unless="${mf.workflow_state == 'unlabeled'}">已标注 <span th:text="${sf.annotated_count}"></span> / <span th:text="${sf.count}"></span> 张</span>
                        <span class="subfolder-actions">
                            <button th:if="${mf.workflow_state == 'annotating'}" class="btn-icon" th:attr="data-task=${sf.name}" onclick="event.stopPropagation(); transitionTask(this.dataset.task, 'annotating', 'review')">Done</button>
                            <button th:if="${mf.workflow_state == 'review'}" class="btn-icon" th:attr="data-task=${sf.name}" onclick="event.stopPropagation(); transitionTask(this.dataset.task, 'review', 'completed')">Done</button>
                            <button th:if="${isAdmin}" class="btn-icon export" title="导出" th:attr="data-main=${mf.name},data-sub=${sf.name}" onclick="event.stopPropagation(); exportSubProject(this.dataset.main, this.dataset.sub)">&#11015;</button>
                            <button th:unless="${mf.legacy}" class="btn-icon" title="重命名" th:attr="data-main=${mf.name},data-sub=${sf.name}" onclick="event.stopPropagation(); renameSubProject(this.dataset.main, this.dataset.sub)">&#9999;</button>
                        </span>
                    </div>
                    <div class="subfolder-item" th:if="${#lists.isEmpty(mf.subfolders)}" style="color:var(--text-dim);cursor:default;font-size:12px;">
                        <span>暂无子文件夹</span>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(mainFolders)}" style="text-align:center;padding:40px;color:var(--text-dim);">
                <p>暂无数据，请上传数据集</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function toggleUploadMode() {
            const section = document.getElementById('upload-section');
            const button = document.getElementById('toggle-upload-btn');
            const opening = section.style.display === 'none';
            section.style.display = opening ? 'block' : 'none';
            button.textContent = opening ? '✕ 退出上传' : '📁 上传任务文件夹';
            button.classList.toggle('accent-green', !opening);
            button.classList.toggle('accent-red', opening);
            if (opening) section.scrollIntoView({behavior: 'smooth', block: 'start'});
        }

        function onMainFolderClick(folderName, headerEl, idx) {
            toggleFolder(idx);
        }

        function toggleFolder(idx) {
            const card = document.getElementById('card-' + idx);
            if (card) card.classList.toggle('open');
        }

        function encodeUploadManifest(manifest) {
            const bytes = new TextEncoder().encode(JSON.stringify(manifest));
            let binary = '';
            const chunkSize = 0x8000;
            for (let offset = 0; offset < bytes.length; offset += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
            }
            return btoa(binary);
        }

        async function uploadFiles() {
            const input = document.getElementById('file-input-folder');
            const status = document.getElementById('upload-status');
            if (input.files.length === 0) return alert('请选择要上传的图片文件夹');
            const firstPath = input.files[0].webkitRelativePath || input.files[0].name;
            const taskName = firstPath.split('/')[0];
            if (!taskName) return alert('无法识别任务文件夹名称');
            const totalFiles = input.files.length;
            const batchSize = 20;
            const uploadId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
            let uploadedCount = 0;
            const cancelUpload = () => fetch(`/api/annotation-upload/${encodeURIComponent(uploadId)}`, {method:'DELETE'}).catch(() => {});
            status.innerText = `准备上传 ${taskName}（${totalFiles} 个文件）到未标注...`;
            status.style.color = 'var(--text-secondary)';

            for (let i = 0; i < totalFiles; i += batchSize) {
                const chunk = Array.from(input.files).slice(i, i + batchSize);
                const formData = new FormData();
                formData.append('task_name', taskName);
                formData.append('upload_id', uploadId);
                formData.append('complete', String(i + batchSize >= totalFiles));
                const paths = [];
                chunk.forEach(file => {
                    formData.append('files[]', file);
                    paths.push(file.webkitRelativePath || file.name);
                });
                formData.append('file_paths', JSON.stringify(paths));
                try {
                    status.innerText = `上传中 ${i + 1}-${Math.min(i + batchSize, totalFiles)} / ${totalFiles}...`;
                    const res = await fetch('/api/annotation-upload', { method: 'POST', body: formData });
                    const text = await res.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (_) {
                        const hint = res.status === 413 ? '文件过大，请重启服务器使新配置生效' : text.slice(0, 120);
                        status.innerText = `上传失败 (HTTP ${res.status}): ${hint}`;
                        status.style.color = 'var(--accent-red)';
                        return;
                    }
                    if (!res.ok || data.status !== 'success') {
                        await cancelUpload();
                        status.innerText = `上传出错: ` + (data.error || `HTTP ${res.status}`);
                        status.style.color = 'var(--accent-red)';
                        return;
                    }
                    uploadedCount += Number(data.count || 0);
                } catch (e) {
                    await cancelUpload();
                    status.innerText = `网络错误: ` + e;
                    status.style.color = 'var(--accent-red)';
                    return;
                }
            }

            status.innerText = `上传完成：${taskName} 已进入未标注。`;
            status.style.color = 'var(--accent-green)';
            alert(`成功上传 ${uploadedCount} 个文件，任务已进入“未标注”。`);
            location.reload();
        }

        async function transitionTask(task, from, to, allowIncomplete = false) {
            const label = to === 'review' ? '提交到待检查' : '完成检查并进入已完成';
            if (!confirm(`确认${label}：${task}？`)) return;
            const response = await fetch(`/api/workflow/tasks/${encodeURIComponent(task)}/transition`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({from, to, allow_incomplete: allowIncomplete})
            });
            const data = await response.json();
            if (response.status === 409 && !allowIncomplete) {
                if (confirm(`${data.error || '仍有图片没有 JSON'}。是否仍要继续？`)) {
                    return transitionTask(task, from, to, true);
                }
                return;
            }
            if (!response.ok) return alert(data.error || '状态更新失败');
            alert('任务状态已更新。');
            location.reload();
        }

        async function renameProject(oldName) {
            const newName = prompt("请输入新的主文件夹名称:", oldName);
            if (!newName || newName === oldName) return;
            try {
                const res = await fetch('/api/rename_project', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({old_name: oldName, new_name: newName, level: 'main'})
                });
                const data = await res.json();
                if (data.status === 'success') { location.reload(); }
                else { alert("重命名失败: " + (data.error || 'Unknown error')); }
            } catch (e) { alert("Error: " + e); }
        }

        async function renameSubProject(mainFolder, oldName) {
            const newName = prompt("请输入新的子文件夹名称:", oldName);
            if (!newName || newName === oldName) return;
            try {
                const res = await fetch('/api/rename_project', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({main_folder: mainFolder, old_name: oldName, new_name: newName, level: 'sub'})
                });
                const data = await res.json();
                if (data.status === 'success') { location.reload(); }
                else { alert("重命名失败: " + (data.error || 'Unknown error')); }
            } catch (e) { alert("Error: " + e); }
        }

        function exportSubProject(mainFolder, subfolder) {
            window.location.href = '/api/export/' + encodeURIComponent(mainFolder) + '/' + encodeURIComponent(subfolder);
        }

        (function() {
            const cards = document.querySelectorAll('.main-folder-card');
            if (cards.length === 1) cards[0].classList.add('open');
        })();
    </script>
</body>
</html>

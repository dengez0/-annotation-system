<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>激活管理员设备</title>
    <link rel="stylesheet" href="/static/css/style.css?v=7">
    <style>
        .activation-shell { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
        .activation-card { width:min(100%,520px); padding:28px; border:1px solid var(--border-color); border-radius:10px; background:var(--bg-panel); }
        .activation-card h1 { margin:0 0 12px; font-size:24px; }
        .activation-card p { color:var(--text-secondary); line-height:1.6; }
        .activation-card input { width:100%; box-sizing:border-box; padding:11px 12px; margin:12px 0; border:1px solid var(--border-color); border-radius:5px; background:var(--input-bg); color:var(--text-primary); font-family:monospace; }
        .activation-actions { display:flex; gap:10px; align-items:center; margin-top:8px; }
        .activation-error { color:var(--accent-red); }
        .activation-ok { color:var(--accent-green); }
    </style>
</head>
<body class="dark">
<main class="activation-shell">
    <section class="activation-card">
        <h1>激活管理员设备</h1>
        <p>输入为这台电脑单独发放的设备令牌。验证成功后，浏览器会保存管理员凭证；IP 地址变化不会影响权限。</p>
        <p th:if="${alreadyActive}" class="activation-ok">当前浏览器已经具有管理员权限。</p>
        <p th:if="${error}" th:text="${error}" class="activation-error"></p>
        <form method="post" action="/admin/activate" autocomplete="off">
            <label for="token">设备令牌</label>
            <input id="token" name="token" type="password" required minlength="32" maxlength="512" autocomplete="off" spellcheck="false">
            <div class="activation-actions">
                <button type="submit" class="toolbar-btn accent-purple">激活此浏览器</button>
                <a href="/annotation" class="toolbar-btn">返回数据标注</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>

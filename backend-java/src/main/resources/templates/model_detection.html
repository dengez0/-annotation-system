<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>模型检测</title><link rel="stylesheet" href="/static/css/style.css?v=6"><style>.model-page{max-width:900px;margin:0 auto;padding:42px 24px}.model-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.model-panel{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:20px;margin-bottom:18px}.model-panel h2{margin:0 0 10px;font-size:18px}.model-note{color:var(--text-secondary);line-height:1.6}.model-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-color)}.model-row:last-child{border-bottom:0}.model-name{flex:1}.upload-row{display:flex;gap:10px;flex-wrap:wrap}input[type=file],input[type=text]{padding:8px;color:var(--text-primary);background:var(--input-bg);border:1px solid var(--border-color);border-radius:4px}</style></head><body class="dark"><main class="model-page"><div class="model-header"><h1>模型检测</h1><button class="toolbar-btn" onclick="location.href='/'">Home</button></div><section class="model-panel"><h2>模型管理</h2><div class="upload-row"><input id="model-file" type="file" accept=".pt,.onnx,.engine"><input id="model-name" type="text" placeholder="可选：自定义模型名"><button class="toolbar-btn accent-green" onclick="uploadModel()">上传模型</button></div><div id="upload-status" class="model-note"></div></section><section class="model-panel"><h2>可用模型</h2><div id="model-list" class="model-note">正在加载…</div></section><section class="model-panel"><h2>检测功能</h2><p class="model-note">本页面当前用于统一管理 YOLO 模型；实际图片检测将在后续版本接入。这里不会运行模型，也不会修改任何项目标注。</p></section></main><script>async function loadModels(){const b=document.getElementById('model-list');try{const r=await fetch('/api/models'),m=await r.json();b.innerHTML='';if(!m.length){b.textContent='暂无可用模型。';return}m.forEach(n=>{const row=document.createElement('div'),label=document.createElement('span'),del=document.createElement('button');row.className='model-row';label.className='model-name';label.textContent=n;del.className='btn-icon delete';del.textContent='删除';del.onclick=()=>deleteModel(n);row.append(label,del);b.append(row)})}catch(_){b.textContent='模型列表加载失败。'}}async function uploadModel(){const i=document.getElementById('model-file'),s=document.getElementById('upload-status');if(!i.files[0]){s.textContent='请选择模型文件。';return}const d=new FormData();d.append('model_file',i.files[0]);const n=document.getElementById('model-name').value.trim();if(n)d.append('custom_name',n);s.textContent='正在上传…';try{const r=await fetch('/api/upload_model',{method:'POST',body:d}),v=await r.json();if(!r.ok||v.status!=='success')throw Error(v.error||'上传失败');i.value='';document.getElementById('model-name').value='';s.textContent='上传成功。';loadModels()}catch(e){s.textContent='上传失败：'+e.message}}async function deleteModel(n){if(!confirm(`确定删除模型“${n}”吗？`))return;try{const r=await fetch('/api/delete_model/'+encodeURIComponent(n),{method:'DELETE'}),v=await r.json();if(!r.ok||v.status!=='success')throw Error(v.error||'删除失败');loadModels()}catch(e){alert('删除失败：'+e.message)}}loadModels();</script></body></html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型检测</title><link rel="stylesheet" href="/static/css/style.css?v=9"><style>
.page{max-width:1120px;margin:auto;padding:32px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:9px;padding:18px;margin-top:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.field{display:grid;gap:5px;color:var(--text-secondary);font-size:12px}.field input,.field select{min-width:150px;padding:8px;background:var(--input-bg);border:1px solid var(--border-color);color:var(--text-primary);border-radius:4px}.note{color:var(--text-secondary);font-size:13px;line-height:1.6}.models{display:grid;gap:7px;margin-top:12px}.model{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border-color);padding:8px}.model span{flex:1}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.result{border:1px solid var(--border-color);border-radius:7px;overflow:hidden;padding:9px}.result img{width:100%;max-height:190px;object-fit:contain;background:#111}.error{color:var(--accent-red)}.status{min-height:22px}.detections{font-size:12px;color:var(--text-secondary);margin-top:6px}.danger{color:#ff8c8c}@media(max-width:600px){.page{padding:20px 12px}}
</style></head><body class="dark"><main class="page"><header class="head"><div><h1>模型检测</h1><p class="note">上传 PT 或 ONNX 模型，对一张或多张图片进行检测。检测结果仅供预览与下载，不会写入标注任务。</p></div><button class="toolbar-btn" onclick="location.href='/'">Home</button></header>
<section class="card"><h2>模型管理</h2><div class="row"><input id="model-file" type="file" accept=".pt,.onnx"><input id="model-name" type="text" placeholder="可选：自定义模型名"><button class="toolbar-btn accent-green" onclick="uploadModel()">上传模型</button></div><div id="upload-status" class="note status"></div><div id="model-list" class="models note">正在加载…</div></section>
<section class="card"><h2>图片检测</h2><div class="row"><label class="field">模型<select id="model-select"></select></label><label class="field">置信度 0–1<input id="confidence" type="number" min="0" max="1" step="0.01" value="0.25"></label><label class="field">IoU 0–1<input id="iou" type="number" min="0" max="1" step="0.01" value="0.45"></label><label class="field">框线宽<input id="line-width" type="number" min="1" max="10" value="3"></label></div><div class="row" style="margin-top:14px"><input id="images" type="file" accept="image/*" multiple><button id="run" class="toolbar-btn accent-green" onclick="startDetection()">开始检测</button></div><p class="note">结果保留 24 小时，可随时下载 ZIP 或立即删除。</p><div id="task-status" class="note status"></div></section>
<section id="result-card" class="card" style="display:none"><div class="head"><h2>检测结果</h2><div class="row"><button id="download" class="toolbar-btn accent-green">下载 ZIP</button><button id="delete" class="toolbar-btn danger">删除结果</button></div></div><div id="summary" class="note"></div><div id="results" class="results" style="margin-top:12px"></div></section></main>
<script>
let jobId=null,poller=null;
const $=id=>document.getElementById(id); const text=(node,value)=>node.textContent=value;
async function loadModels(){const list=$('model-list'),select=$('model-select');try{const r=await fetch('/api/models'),data=await r.json();if(!r.ok)throw Error(data.error||'模型列表加载失败');const models=data.filter(n=>/\.(pt|onnx)$/i.test(n));list.innerHTML='';select.innerHTML='';if(!models.length){text(list,'暂无可用于检测的 PT/ONNX 模型。');return;}models.forEach(name=>{const row=document.createElement('div'),label=document.createElement('span'),del=document.createElement('button'),option=document.createElement('option');row.className='model';label.textContent=name;del.className='btn-icon delete';del.textContent='删除';del.onclick=()=>deleteModel(name);row.append(label,del);list.append(row);option.value=name;option.textContent=name;select.append(option);});}catch(e){text(list,e.message)}}
async function uploadModel(){const file=$('model-file').files[0],status=$('upload-status');if(!file)return text(status,'请选择 PT 或 ONNX 模型。');const data=new FormData();data.append('model_file',file);if($('model-name').value.trim())data.append('custom_name',$('model-name').value.trim());text(status,'正在上传并校验模型…');try{const r=await fetch('/api/upload_model',{method:'POST',body:data}),v=await r.json();if(!r.ok||v.status!=='success')throw Error(v.error||'上传失败');text(status,'模型上传成功。');$('model-file').value='';$('model-name').value='';loadModels();}catch(e){text(status,'上传失败：'+e.message)}}
async function deleteModel(name){if(!confirm('确定删除模型 '+name+' 吗？'))return;const r=await fetch('/api/delete_model/'+encodeURIComponent(name),{method:'DELETE'});const v=await r.json();if(!r.ok)alert(v.error||'删除失败');else loadModels();}
async function startDetection(){const files=[...$('images').files],model=$('model-select').value,status=$('task-status');if(!model)return text(status,'请先上传或选择模型。');if(!files.length)return text(status,'请选择至少一张图片。');const form=new FormData();form.append('model_name',model);form.append('confidence',$('confidence').value);form.append('iou',$('iou').value);form.append('line_width',$('line-width').value);files.forEach(file=>form.append('images',file));$('run').disabled=true;text(status,'正在上传图片并创建检测任务…');try{const r=await fetch('/api/model-detection/tasks',{method:'POST',body:form}),v=await r.json();if(!r.ok)throw Error(v.error||'任务创建失败');jobId=v.job_id;$('result-card').style.display='block';$('results').innerHTML='';poll();}catch(e){text(status,'检测启动失败：'+e.message);$('run').disabled=false;}}
async function poll(){if(!jobId)return;try{const r=await fetch('/api/model-detection/tasks/'+jobId),v=await r.json();if(!r.ok)throw Error(v.error||'状态读取失败');const task=v.task||{},summary=task.summary||{};text($('task-status'),`${task.stage||task.status||'处理中'}：${task.progress||0}/${task.total||0}`);if(v.results)renderResults(v.results,summary);if(task.status==='completed'||task.status==='failed'||task.status==='cancelled'){$('run').disabled=false;poller=null;return;}poller=setTimeout(poll,900);}catch(e){text($('task-status'),'状态读取失败：'+e.message);poller=setTimeout(poll,2000)}}
function renderResults(results,summary){text($('summary'),`成功 ${summary.success||0} 张，失败 ${summary.failed||0} 张，检测到目标 ${summary.with_objects||0} 张。`);const box=$('results');box.innerHTML='';results.forEach(item=>{const card=document.createElement('article'),title=document.createElement('strong'),info=document.createElement('div');card.className='result';title.textContent=item.name;card.append(title);if(item.annotated){const img=document.createElement('img');img.src=item.annotated;img.alt=item.name;card.append(img);}text(info,item.error?`失败：${item.error}`:`检测到 ${item.count||0} 个目标`);info.className=item.error?'detections error':'detections';card.append(info);if(item.detections?.length){const labels=document.createElement('div');labels.className='detections';labels.textContent=item.detections.map(d=>`${d.label} ${(d.confidence||0).toFixed(2)}`).join(' · ');card.append(labels)}box.append(card)})}
$('download').onclick=()=>{if(jobId)location.href='/api/model-detection/tasks/'+jobId+'/download'};$('delete').onclick=async()=>{if(!jobId||!confirm('确定删除本次检测结果吗？'))return;const r=await fetch('/api/model-detection/tasks/'+jobId,{method:'DELETE'});if(r.ok){jobId=null;$('result-card').style.display='none';text($('task-status'),'检测结果已删除。')}else alert('删除失败')};loadModels();
</script></body></html>

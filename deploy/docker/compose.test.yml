name: simplelabel-test

services:
  simplelabel-test:
    image: "${SIMPLELABEL_TEST_IMAGE:-simplelabel:test-29090}"
    container_name: simplelabel-test
    restart: "no"
    user: "${SIMPLELABEL_UID:-1000}:${SIMPLELABEL_GID:-1000}"
    env_file: .env.test
    ports:
      - "${SIMPLELABEL_TEST_BIND_ADDRESS:-192.168.1.226}:${SIMPLELABEL_TEST_WEB_PORT:-29090}:18083"
      - "${SIMPLELABEL_TEST_BIND_ADDRESS:-192.168.1.226}:${SIMPLELABEL_TEST_MODEL_PORT:-29091}:29091"
    volumes:
      - ../../runtime-test/data:/srv/simplelabel/data
      - ../../runtime-test/models:/srv/simplelabel/models
      - ../../runtime-test/logs:/srv/simplelabel/logs
      - ../../runtime-test/admin:/srv/simplelabel/admin
      - ../../runtime-test/processed:/srv/simplelabel/processed
      - ../../runtime-test/backups:/srv/simplelabel/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:18083/internal/health"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 6g
    cpus: 1.0

services:
  simplelabel-test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: simplelabel:test
    container_name: simplelabel-test
    restart: unless-stopped
    user: "${SIMPLELABEL_UID:-1000}:${SIMPLELABEL_GID:-1000}"
    env_file: .env.test
    ports:
      - "0.0.0.0:18084:18083"
      - "0.0.0.0:8001:8001"
    volumes:
      - ../../runtime-test/data:/srv/simplelabel/data
      - ../../runtime-test/models:/srv/simplelabel/models
      - ../../runtime-test/logs:/srv/simplelabel/logs
      - ../../runtime-test/admin:/srv/simplelabel/admin
      - ../../runtime-test/processed:/srv/simplelabel/processed
      - ../../runtime-test/backups:/srv/simplelabel/backups
    tmpfs:
      - /tmp:size=2g,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:18083/internal/health"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 9g
    cpus: 4.0
